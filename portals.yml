# Finance Job Radar (India): career-ops scanner config for junior finance roles in India.
# Read by career-ops scan.mjs (pinned in .github/workflows/scan.yml).
#
# What gets through to your phone:
#   1. Title matches at least one `positive` keyword and no `negative` keyword
#   2. Title is not senior (skip_tiers: senior drops Senior/Lead/VP/Director/Head of...)
#   3. Location is in India (or the posting gives no location)
#   5. Posted in the last 30 days (where the board gives a date)
#
# Edit the keyword lists freely. Matching is case-insensitive substring;
# `word:` means whole word only.

skip_tiers: [senior]

max_posting_age_days: 30

title_filter:
  positive:
    # Titles must name a finance function. Bare "Analyst" / "Associate" let in
    # too much (business, data, AML, compliance analysts), so they are paired
    # with a finance word instead (" + " means both words, any order).
    # -- FP&A / financial analysis / accounting --
    - "Financial Analyst"
    - "Finance Analyst"
    - "Finance Associate"
    - "FP&A"
    - "Financial Planning"
    - "Finance Business Partner"
    - "Commercial Finance"
    - "Commercial Analyst"
    - "Pricing Analyst"
    - "Management Accountant"
    - "Assistant Accountant"
    - "Financial Accountant"
    - "Trainee Accountant"
    - "Fund Accountant"
    - "Fund Accounting"
    - "Financial Reporting"
    - "Product Control"
    - "Treasury"
    - "Financial Controller"
    - "Finance Transformation"
    - "Accountant"
    # -- Credit & risk --
    - "Credit"
    - "Risk Analyst"
    - "Risk Associate"
    - "Market Risk"
    - "Liquidity Risk"
    - "Model Risk"
    - "Counterparty Risk"
    - "Prudential Risk"
    - "Underwriting Analyst"
    # -- Investment banking / advisory --
    - "Investment Banking"
    - "M&A"
    - "Mergers"
    - "Corporate Finance"
    - "Transaction Services"
    - "Deal Advisory"
    - "Strategic Advisory"
    - "Debt Advisory"
    - "Capital Advisory"
    - "Financial Advisory"
    - "word:Debt"
    - "Valuation"
    - "Restructuring"
    - "Capital Markets"
    - "Leveraged Finance"
    - "Structured Finance"
    - "Corporate Banking"
    # -- Research / markets --
    - "Equity Research"
    - "Investment Research"
    - "Research Analyst"
    - "Research Associate"
    - "Credit Research"
    - "Financial Research"
    - "Fundamental Research"
    - "Valuations"
    - "Investment Banking Associate"
    - "Fund Accounting"
    - "word:NAV"
    - "Financial Planning & Analysis"
    - "Treasury Analyst"
    - "Trader"
    - "Trading Analyst"
    - "Trading Assistant"
    - "Quant"
    # -- Asset & wealth management / private markets --
    - "Investment Analyst"
    - "Investment Associate"
    - "Investment Management"
    - "Investment Operations"
    - "Asset Management"
    - "Portfolio Analyst"
    - "Portfolio Analytics"
    - "Portfolio Management"
    - "Fund Analyst"
    - "Private Equity"
    - "Private Credit"
    - "Private Markets"
    # -- Consulting --
    - "Management Consultant"
    - "Strategy Consultant"
    - "Strategy Analyst"
    - "Strategy Associate"
    - "Financial Services Consult"
    # -- Graduate programmes with a finance focus --
    - "word:Analyst Programme"
    - "word:Analyst Program"
    - "Management Trainee + finance"
    - "Graduate Trainee + finance"
    - "graduate + finance"
    - "graduate + financial"
    - "graduate + risk"
    - "graduate + investment"
    - "graduate + banking"
    - "graduate + markets"
    - "graduate + accountan"
    - "graduate + treasury"

  negative:
    # Seniority not caught by skip_tiers
    - "Manager"
    - "Managing Director"
    - "Executive Director"
    - "Vice President"
    - "word:VP"
    - "word:AVP"
    - "Head of"
    - "Chief"
    - "Associate Partner"
    - "Equity Partner"
    - "Salaried Partner"
    - "word:Principal"
    # Student programmes (you have graduated)
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Placement"
    - "Summer"
    - "Spring Week"
    - "Spring Insight"
    - "Insight Programme"
    - "Off-Cycle"
    - "Apprentice"
    - "Work Experience"
    # Finance-adjacent roles that are not your target
    - "Business Analyst"
    - "Data Analyst"
    - "word:AML"
    - "word:KYC"
    - "Financial Crime"
    - "Compliance"
    - "Legal"
    - "Counsel"
    - "Audit"
    - "word:Tax"
    - "Actuar"
    - "Claims"
    - "Loss Adjuster"
    - "Marketing"
    - "Sales"
    - "Product Owner"
    - "Administrator"
    - "Coordinator"
    - "Working Student"
    - "Workshop"
    - "word:Talk"
    - "Volunteer"
    - "Reporter"
    - "Journalist"
    - "Leader"
    - "Resilience"
    - "Credit Control"
    - "Credit Card"
    # Tech / non-finance
    - "Software"
    - "Engineer"
    - "Developer"
    - "DevOps"
    - "Cyber"
    - "Security Analyst"
    - "SOC Analyst"
    - "Network"
    - "Infrastructure"
    - "Cloud"
    - "Data Scientist"
    - "Machine Learning"
    - "Salesforce"
    - "word:SAP"
    - "word:UX"
    - "Designer"
    - "Technician"
    - "Mechanic"
    - "Nurse"
    - "Pharmac"
    - "Clinical"
    - "Scientist"
    - "Warehouse"
    - "Driver"
    - "Store"
    - "Retail Assistant"
    - "Customer Service"
    - "Contact Centre"
    - "Call Centre"
    - "Payroll"
    - "Recruit"
    - "Talent Acquisition"
    - "Paralegal"
    - "Solicitor"
    - "Lawyer"
    - "word:HR"
    - "Human Resources"

# India only. Order the scanner uses: block_hard, then always_allow, then block,
# then allow. Postings with no location pass (strict is off).
location_filter:
  block_hard:
    # "India" is a substring of these US places
    - "Indiana"
    - "Indianapolis"
    - "Indian Wells"
    - "Indian Trail"
  always_allow:
    - "India"
    - "Mumbai"
    - "Bombay"
    - "Navi Mumbai"
    - "Thane"
    - "Powai"
    - "Bengaluru"
    - "Bangalore"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "New Delhi"
    - "Delhi"
    - "Hyderabad"
    - "Pune"
    - "Chennai"
    - "Kolkata"
    - "Ahmedabad"
    - "GIFT City"
    - "Gandhinagar"
    - "Nagpur"
    - "Jaipur"
    - "Indore"
    - "Chandigarh"
    - "Mohali"
    - "Kochi"
    - "Coimbatore"
    - "Vadodara"
    - "Mangalore"
    - "Mysore"
    - "Bhubaneswar"
    - "Lucknow"
    - "Trivandrum"
    - "Thiruvananthapuram"
    - "Maharashtra"
    - "Karnataka"
    - "Haryana"
    - "Telangana"
    - "Tamil Nadu"
    - "Gujarat"
  block:
    - "United Kingdom"
    - "London"
    - "United States"
    - "USA"
    - "Singapore"
    - "Hong Kong"
    - "Dubai"
    - "United Arab Emirates"
    - "Australia"
    - "Canada"
    - "Germany"
    - "France"
    - "Ireland"
    - "Poland"
    - "Philippines"
    - "China"
    - "Japan"
  # Anything with a location must be in India (always_allow above); roles
  # elsewhere are dropped even if the country isn't in the block list.
  allow:
    - "India"
  remote_title_fallback: false

# Visa wording doesn't apply to roles in India.
visa_filter:
  enabled: false

