# Job boards searched every hour by scripts/boards.mjs, on top of the employer
# careers sites in portals.yml. Results go through the same title, seniority
# and India-location filters, and are grouped by CV like everything else.
#
# Adzuna (official API) and LinkedIn are used for India. Naukri, foundit, iimjobs, Instahyre and
# Indeed India either block automated access or forbid it in their terms.
# Set up email alerts on those sites directly.

max_age_days: 3        # ignore postings older than this

queries:
  - financial analyst
  - FP&A analyst
  - finance analyst
  - credit analyst
  - credit risk analyst
  - risk analyst
  - investment analyst
  - equity research
  - equity research associate
  - investment banking analyst
  - M&A analyst
  - corporate finance analyst
  - valuation analyst
  - fund accountant
  - treasury analyst
  - portfolio analyst

boards:
  adzuna:              # official API; needs repo secrets ADZUNA_APP_ID and ADZUNA_APP_KEY
    country: in
    category: accounting-finance-jobs
    what_or: analyst associate graduate junior trainee assistant
    queries: [1, 2, 3, 4]  # results pages, 50 newest jobs each
    days: 2
    every_hours: 24    # once a day: 4 calls (free-plan limits)
  linkedin:
    location: India
    hours: 24          # posted in the last 24 hours, newest first
    max_pages: 3       # up to 30 newest cards per search (hourly runs keep up)
