# Employers in India the weekly discovery job tries to add to portals.yml.
#
# For each company the job:
#   1. asks career-ops' discover-ats.mjs to find a Greenhouse / Lever / Ashby /
#      Workable / SmartRecruiters / etc. board from the name;
#   2. if that fails, scripts/find-ats.mjs opens the company's website and
#      careers pages and looks for links to a hiring system career-ops can scan
#      (Workday, Oracle, Eightfold, iCIMS, Taleo, SuccessFactors, ...).
# Anything found is appended to portals.yml; anything not found is listed in
# reports/discovery.md. Many Indian firms use Darwinbox, Keka or their own
# portals, which can't be scanned; for those, set up alerts on their site.
#
# `name` is required, `website` helps, `careers` (careers page URL) helps most.

