name: Full job-list check
# Run by hand (Actions -> Full job-list check -> Run workflow). Checks EVERY role
# on JOBS.md against its job board or hiring system once, takes the closed ones
# off, and rebuilds JOBS.md. LinkedIn is checked slowly to avoid rate limits,
# so this takes 1-3 hours; hourly scans keep running meanwhile.
on: workflow_dispatch
concurrency:
  group: finance-job-radar-india-full-check
  cancel-in-progress: false
permissions:
  contents: write
env:
  CAREER_OPS_VERSION: career-ops-v1.38.0
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download career-ops scanner
        run: |
          git clone --quiet --depth 1 --branch "$CAREER_OPS_VERSION" \
            https://github.com/career-ops-hq/career-ops.git "$RUNNER_TEMP/engine"
          cd "$RUNNER_TEMP/engine"
          npm install --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Check every listed role
        run: node scripts/check-live.mjs --engine "$RUNNER_TEMP/engine" --all
      - name: Merge results into the latest data, rebuild JOBS.md, save
        run: |
          cp data/liveness.json "$RUNNER_TEMP/sweep.json"
          git config user.name "finance-job-radar"
          git config user.email "finance-job-radar@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node -e '
              const fs = require("fs");
              const sweep = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const cur = JSON.parse(fs.readFileSync("data/liveness.json", "utf8"));
              let n = 0;
              for (const [u, v] of Object.entries(sweep)) {
                if (cur[u]?.status === "closed") continue;
                if (v.status === "closed") { cur[u] = v; n++; continue; }
                if (!cur[u]?.checked_at || (v.checked_at || "") > cur[u].checked_at) cur[u] = v;
              }
              fs.writeFileSync("data/liveness.json", JSON.stringify(cur, null, 1) + "\n");
              console.log(`merged: ${n} newly closed roles`);
            ' "$RUNNER_TEMP/sweep.json"
            node scripts/jobs-page.mjs --engine "$RUNNER_TEMP/engine" --out JOBS.md
            git add -f data/ JOBS.md
            git diff --cached --quiet && exit 0
            git commit -q -m "full job-list check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "could not save after 5 tries"; exit 1
