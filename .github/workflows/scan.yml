name: India finance job scan

# Runs every hour. GitHub may start a scheduled run 5-20 minutes late at busy
# times, so expect alerts within roughly 1-1.5 hours of a role going live.
on:
  schedule:
    # Two slots per hour: GitHub's free scheduler often drops runs when busy,
    # so the second slot is a backup. The reliable hourly trigger is the
    # external cron-job.org call to workflow_dispatch (see README).
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-job-radar-india
  cancel-in-progress: false

env:
  CAREER_OPS_VERSION: career-ops-v1.38.0

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download career-ops scanner
        run: |
          git clone --quiet --depth 1 --branch "$CAREER_OPS_VERSION" \
            https://github.com/career-ops-hq/career-ops.git "$RUNNER_TEMP/engine"
          cd "$RUNNER_TEMP/engine"
          npm install --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: Scan all tracked companies
        env:
          CAREER_OPS_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p data
          if [ -f data/scan-history.tsv ]; then echo "SEED_RUN=0" >> "$GITHUB_ENV"; else echo "SEED_RUN=1" >> "$GITHUB_ENV"; fi
          # --since 2: only postings from the last 2 days. Boards list newest first,
          # so this stops paging early and keeps each hourly run to a few minutes.
          # Exit code 2 means at least one board failed; the rest still count.
          node "$RUNNER_TEMP/engine/scan.mjs" --since 2 --json --quiet > "$RUNNER_TEMP/receipt.json" 2> "$RUNNER_TEMP/scan.log" || true
          tail -n 40 "$RUNNER_TEMP/scan.log"

      - name: Search LinkedIn (India)
        env:
          CAREER_OPS_ROOT: ${{ github.workspace }}
          RADAR_COUNTRY: India
          RADAR_LANG: en-IN,en;q=0.9
        run: node scripts/boards.mjs --engine "$RUNNER_TEMP/engine" --receipt "$RUNNER_TEMP/receipt.json"

      - name: Search Indian startups and scale-ups (companies_startups.yaml)
        env:
          CAREER_OPS_ROOT: ${{ github.workspace }}
        run: node scripts/startups.mjs --engine "$RUNNER_TEMP/engine" --receipt "$RUNNER_TEMP/receipt.json" || echo "startup search failed; carrying on"

      - name: Log what this scan found
        run: |
          if [ "$SEED_RUN" = "1" ]; then KIND=starting
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then KIND=hourly
          else KIND=hourly; fi  # cron-job.org starts most runs this way
          node scripts/log-scan.mjs "$RUNNER_TEMP/receipt.json" "$KIND"

      - name: Take closed postings off the list
        run: node scripts/check-live.mjs --engine "$RUNNER_TEMP/engine" --max 80

      - name: Update the jobs page (JOBS.md) and top picks per CV
        run: node scripts/jobs-page.mjs --engine "$RUNNER_TEMP/engine" --out JOBS.md

      - name: Send alerts (new roles by CV; morning digest after 08:00 UK)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/notify.mjs "$RUNNER_TEMP/receipt.json" data/pipeline.md

      - name: Write run summary
        run: |
          node -e '
            const fs=require("fs");
            let r={};
            try { r=JSON.parse(fs.readFileSync(process.argv[1],"utf8").trim().split("\n").filter(l=>l.startsWith("{")).pop()||"{}"); } catch {}
            const s={
              finished_at:new Date().toISOString(),
              alerts_configured:{ntfy:Boolean(process.env.HAS_NTFY),slack:Boolean(process.env.HAS_SLACK)},
              boards_scanned:r.scanned??null, postings_seen:r.found??null, filtered_out:r.filtered??null,
              new_matches:r.added??0, boards_failed:(r.errors||[]).length,
              failed:(r.errors||[]).map(e=>({company:e.company,error:String(e.error).slice(0,160)})),
            };
            fs.writeFileSync("data/last-run.json", JSON.stringify(s,null,2)+"\n");
            console.log(JSON.stringify({...s,failed:undefined}));
          ' "$RUNNER_TEMP/receipt.json"
        env:
          HAS_NTFY: ${{ secrets.NTFY_TOPIC != '' && '1' || '' }}
          HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' && '1' || '' }}

      - name: Save what has been seen
        run: |
          git config user.name "finance-job-radar"
          git config user.email "finance-job-radar@users.noreply.github.com"
          git add -f data/ JOBS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          # Everything committed here is generated by this run, so if another
          # commit touched the same files meanwhile, keep this run's version.
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not save results after 3 tries"; exit 1
